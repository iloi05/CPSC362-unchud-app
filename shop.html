<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
             body {
            background-color: rgb(51, 62, 66);
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            background-color: rgb(124, 52, 213);
            color: white;
            padding: 10px;
            font-size: large;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a,
        .navbar a:visited {
            color: white;
            text-decoration: none;
        }

        .navbar a:hover {
            text-decoration: underline;
            color: rgb(250, 247, 229);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            font-family: Copperplate, Arial, sans-serif;
            color: white;
        }
 .avatar-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #avatarCanvas {
            image-rendering: pixelated;
            background-color: rgb(40, 30, 54);
            border-radius: 12px;
            max-width: 100%; 
        }

        .avatar-controls {
            display: grid;
            gap: 8px;
            color: white;
        }
        .avatar-controls label {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        </style>
    </head>
    <body>
        <!-- Navigation Bar -->
    <div class="navbar">
        <div class="logo">UNCHUD</div>
        <a href="/home">Home</a>
        <a href="/shop">Shop</a>
    </div>
    </body>
</html>
