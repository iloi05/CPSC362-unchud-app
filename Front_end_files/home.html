
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        body {
            background-color: rgb(51, 62, 66);
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            background-color: rgb(124, 52, 213);
            color: white;
            padding: 10px;
            font-size: large;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a,
        .navbar a:visited {
            color: white;
            text-decoration: none;
        }

        .navbar a:hover {
            text-decoration: underline;
            color: rgb(250, 247, 229);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            font-family: Copperplate, Arial, sans-serif;
            color: white;
        }

        /* Main Layout */
        .main-content {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 30px;
            padding: 35px 30px;
            box-sizing: border-box;
            width: 100%;
        }

        /* Calendar */
        .calendar {
            width: 65%;
            flex-shrink: 0;
            padding: 22px;
            background-color: white;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .calendar-header h2 {
            font-size: 26px;
            text-align: center;
            margin: 15px 0;
        }

        .calendar-header button {
            background-color: rgb(124, 52, 213);
            color: white;
            border: none;
            padding: 12px 18px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }

        .calendar-header button:hover {
            background-color: rgb(101, 35, 180);
        }

        /* Calendar Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 5px;
            margin-top: 15px;
        }

        .weekday {
            text-align: center;
            font-weight: bold;
            padding: 10px 0;
            font-size: 15px;
        }

        .day {
            min-height: 110px;
            padding: 10px;
            background-color: rgb(235, 235, 235);
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            overflow-wrap: anywhere;
        }

        .today {
            background-color: rgb(195, 159, 240);
            font-weight: bold;
        }

        /* Assignment labels shown inside their due-date cells */
        .calendar-assignment {
            position: relative;
            margin-top: 6px;
            padding: 5px 22px 5px 6px;
            border-left: 3px solid rgb(124, 52, 213);
            border-radius: 4px;
            background-color: rgb(225, 210, 246);
            color: rgb(40, 30, 54);
            font-size: 11px;
            font-weight: normal;
            line-height: 1.35;
        }

        .assignment-title {
            display: block;
            font-weight: bold;
        }

        .assignment-details {
            display: block;
            margin-top: 2px;
        }

        /* Small check button to mark an assignment complete from the calendar */
        .mark-done {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 17px;
            height: 17px;
            padding: 0;
            border: none;
            border-radius: 3px;
            background-color: rgb(124, 52, 213);
            color: white;
            font-size: 11px;
            line-height: 17px;
            cursor: pointer;
        }

        .mark-done:hover {
            background-color: rgb(30, 110, 50);
        }

        .calendar-status {
            margin: 8px 0 0;
            color: rgb(130, 30, 30);
            font-size: 13px;
        }

        /* Avatar Area */
        .avatar-container {
            flex: 1;
            min-width: 0;
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Responsive Layout */
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
                padding: 25px 15px;
                gap: 25px;
            }

            .calendar {
                width: 100%;
                padding: 15px;
            }

            .avatar-container {
                width: 100%;
                min-height: 300px;
            }

            .calendar-header h2 {
                font-size: 20px;
            }

            .calendar-header button {
                padding: 8px 10px;
                font-size: 12px;
            }

            .day {
                min-height: 65px;
                padding: 5px;
                font-size: 13px;
            }
        }

        .avatar-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #avatarCanvas {
            image-rendering: pixelated;
            background-color: rgb(40, 30, 54);
            border-radius: 12px;
            max-width: 100%; 
        }

        .avatar-controls {
            display: grid;
            gap: 8px;
            color: white;
        }
        .avatar-controls label {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        /* Add / view assignment buttons above the month header */
        .calendar-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
        }

        .calendar-actions button,
        .dialog-buttons button {
            background-color: rgb(124, 52, 213);
            color: white;
            border: none;
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }

        .calendar-actions button:hover,
        .dialog-buttons button:hover {
            background-color: rgb(101, 35, 180);
        }

        .dialog-buttons button.secondary {
            background-color: rgb(200, 200, 200);
            color: rgb(40, 30, 54);
        }

        .dialog-buttons button.secondary:hover {
            background-color: rgb(175, 175, 175);
        }

        .calendar-status.success,
        .dialog-message.success {
            color: rgb(30, 110, 50);
        }

        /* Popup dialogs */
        dialog {
            width: min(420px, calc(100vw - 32px));
            box-sizing: border-box;
            border: none;
            border-radius: 12px;
            padding: 22px;
            color: rgb(40, 30, 54);
        }

        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.5);
        }

        dialog h3 {
            margin: 0 0 15px;
            color: rgb(124, 52, 213);
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: bold;
        }

        /* display: flex above would otherwise override the hidden attribute */
        .form-field[hidden] {
            display: none;
        }

        .form-field input,
        .form-field select {
            padding: 8px;
            border: 1px solid rgb(190, 190, 190);
            border-radius: 5px;
            font-size: 14px;
            font-weight: normal;
        }

        .time-selects {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .time-selects input {
            width: 3.5em;
            text-align: center;
        }

        .dialog-message {
            min-height: 18px;
            margin: 0 0 10px;
            color: rgb(130, 30, 30);
            font-size: 13px;
        }

        .dialog-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Pending assignments list */
        .assignment-list {
            list-style: none;
            margin: 0 0 15px;
            padding: 0;
            max-height: 60vh;
            overflow-y: auto;
        }

        .assignment-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 6px;
            border-left: 3px solid rgb(124, 52, 213);
            border-radius: 4px;
            background-color: rgb(225, 210, 246);
            font-size: 13px;
        }

        .assignment-list li.past-due {
            border-left-color: rgb(170, 40, 40);
            background-color: rgb(246, 215, 215);
        }

        .assignment-list li.empty {
            justify-content: center;
            border-left: none;
            background-color: rgb(235, 235, 235);
        }

        .assignment-list button {
            flex-shrink: 0;
            background-color: rgb(124, 52, 213);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }

        .assignment-list button:hover {
            background-color: rgb(30, 110, 50);
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="logo">UNCHUD</div>
        <a href="/home">Home</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Calendar -->
        <div class="calendar">

            <div class="calendar-actions">
                <button id="openAddDialog" type="button">+ Add Assignment</button>
                <button id="openListDialog" type="button">Assignments</button>
            </div>

            <div class="calendar-header">
                <button id="prevMonth">Previous</button>
                <h2 id="monthYear"></h2>
                <button id="nextMonth">Next</button>
            </div>

            <p id="calendarStatus" class="calendar-status" role="status" aria-live="polite"></p>

            <div class="calendar-grid" id="calendarGrid">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>

        </div>

        <!-- Avatar Area -->
        <div class="avatar-container">
            <div class ="avatar-panel">
                <canvas id="avatarCanvas" width="320" height="320"></canvas>
                <label class="avatar-controls">Body
                    <select id="bodySelect"></select>
                </label>
            </div>
        </div>

    </div>

    <!-- Add Assignment popup -->
    <dialog id="addDialog">
        <form id="addForm">
            <h3>Add Assignment</h3>

            <label class="form-field">Class
                <select id="classSelect"></select>
            </label>

            <label class="form-field" id="newClassField" hidden>New class name
                <input id="newClassInput" type="text" maxlength="60" autocomplete="off">
            </label>

            <label class="form-field">Assignment name
                <input id="assignmentNameInput" type="text" maxlength="100" autocomplete="off" required>
            </label>

            <label class="form-field">Due date
                <input id="dueDateInput" type="date" required>
            </label>

            <div class="form-field">Due time
                <div class="time-selects">
                    <input id="hourInput" type="text" inputmode="numeric" maxlength="2"
                        placeholder="HH" aria-label="Hour" autocomplete="off">
                    :
                    <input id="minuteInput" type="text" inputmode="numeric" maxlength="2"
                        placeholder="MM" aria-label="Minute" autocomplete="off">
                    <select id="ampmSelect" aria-label="AM or PM">
                        <option>AM</option>
                        <option>PM</option>
                    </select>
                </div>
            </div>

            <p id="addMessage" class="dialog-message" role="status" aria-live="polite"></p>

            <div class="dialog-buttons">
                <button type="button" class="secondary" id="cancelAdd">Cancel</button>
                <button type="submit">Add</button>
            </div>
        </form>
    </dialog>

    <!-- Pending assignments popup -->
    <dialog id="listDialog">
        <h3>Current Assignments</h3>
        <ul id="assignmentList" class="assignment-list"></ul>
        <p id="listMessage" class="dialog-message" role="status" aria-live="polite"></p>
        <div class="dialog-buttons">
            <button type="button" class="secondary" id="closeList">Close</button>
        </div>
    </dialog>


    <script src="/front-unchud.js"></script>
    <script src="/avatar.js"></script>
</body>
</html>
