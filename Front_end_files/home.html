
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        body {
            background-color: rgb(51, 62, 66);
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            background-color: rgb(124, 52, 213);
            color: white;
            padding: 10px;
            font-size: large;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a,
        .navbar a:visited {
            color: white;
            text-decoration: none;
        }

        .navbar a:hover {
            text-decoration: underline;
            color: rgb(250, 247, 229);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            font-family: Copperplate, Arial, sans-serif;
            color: white;
        }

        /* Main Layout */
        .main-content {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 30px;
            padding: 35px 30px;
            box-sizing: border-box;
            width: 100%;
        }

        /* Calendar */
        .calendar {
            width: 65%;
            flex-shrink: 0;
            padding: 22px;
            background-color: white;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .calendar-header h2 {
            font-size: 26px;
            text-align: center;
            margin: 15px 0;
        }

        .calendar-header button {
            background-color: rgb(124, 52, 213);
            color: white;
            border: none;
            padding: 12px 18px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }

        .calendar-header button:hover {
            background-color: rgb(101, 35, 180);
        }

        /* Calendar Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 5px;
            margin-top: 15px;
        }

        .weekday {
            text-align: center;
            font-weight: bold;
            padding: 10px 0;
            font-size: 15px;
        }

        .day {
            min-height: 110px;
            padding: 10px;
            background-color: rgb(235, 235, 235);
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            overflow-wrap: anywhere;
        }

        .today {
            background-color: rgb(195, 159, 240);
            font-weight: bold;
        }

        /* Assignment labels shown inside their due-date cells */
        .calendar-assignment {
            margin-top: 6px;
            padding: 5px 6px;
            border-left: 3px solid rgb(124, 52, 213);
            border-radius: 4px;
            background-color: rgb(225, 210, 246);
            color: rgb(40, 30, 54);
            font-size: 11px;
            font-weight: normal;
            line-height: 1.35;
        }

        .assignment-title {
            display: block;
            font-weight: bold;
        }

        .assignment-details {
            display: block;
            margin-top: 2px;
        }

        .calendar-status {
            margin: 8px 0 0;
            color: rgb(130, 30, 30);
            font-size: 13px;
        }

        /* Avatar Area */
        .avatar-container {
            flex: 1;
            min-width: 0;
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Responsive Layout */
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
                padding: 25px 15px;
                gap: 25px;
            }

            .calendar {
                width: 100%;
                padding: 15px;
            }

            .avatar-container {
                width: 100%;
                min-height: 300px;
            }

            .calendar-header h2 {
                font-size: 20px;
            }

            .calendar-header button {
                padding: 8px 10px;
                font-size: 12px;
            }

            .day {
                min-height: 65px;
                padding: 5px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="logo">UNCHUD</div>
        <a href="/home">Home</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Calendar -->
        <div class="calendar">

            <div class="calendar-header">
                <button id="prevMonth">Previous</button>
                <h2 id="monthYear"></h2>
                <button id="nextMonth">Next</button>
            </div>

            <p id="calendarStatus" class="calendar-status" role="status" aria-live="polite"></p>

            <div class="calendar-grid" id="calendarGrid">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>

        </div>

        <!-- Avatar Area -->
        <div class="avatar-container">
            <!-- Future avatar goes here -->
        </div>

    </div>


    <script src="/front-unchud.js"></script>

</body>
</html>
